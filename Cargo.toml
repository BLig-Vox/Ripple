[package]
name = "ripple-terminal"
version = "0.1.0"
edition = "2024"
description = "A Rust terminal emulator with a GPU-rendered interface"
license = "MIT"

[[bin]]
name = "ripple"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
bytemuck = { version = "1", features = ["derive"] }
arboard = "3.7"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "wayland", "wgpu", "x11", "clipboard"] }
portable-pty = "0.9"
vte = "0.15"
libc = "0.2"
